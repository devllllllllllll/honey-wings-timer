<!doctype html>
<html lang="zh-Hant-HK">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="theme-color" content="#17110e" />
<meta name="description" content="蜜味雞中翼 — Siemens 電磁爐五步煎雞翼互動計時器" />
<title>蜜味雞中翼 · 烹飪計時器</title>
<style>
:root{--bg:#15100e;--panel:#241a14;--panel2:#302116;--edge:rgba(255,187,96,.17);--amber:#f9a938;--amber2:#ffd78b;--ink:#fff5e7;--sub:#c6b8a7;--muted:#8f8174;--danger:#ff8c68;--safe:#8fe0b6}*{box-sizing:border-box}html{height:100%;background:var(--bg)}body{margin:0;min-height:100%;font-family:-apple-system,BlinkMacSystemFont,"PingFang HK","Noto Sans TC","Microsoft JhengHei",sans-serif;background:radial-gradient(ellipse at 5% 6%,rgba(182,89,20,.2),transparent 40%),radial-gradient(ellipse at 95% 35%,rgba(162,74,18,.12),transparent 45%),var(--bg);color:var(--ink);-webkit-tap-highlight-color:transparent}button,input{font:inherit}button{cursor:pointer;touch-action:manipulation}button:focus-visible,input:focus-visible{outline:3px solid var(--amber);outline-offset:3px}button:disabled{opacity:.35;cursor:not-allowed}.wrap{width:min(100%,550px);margin:auto;padding:24px 18px max(32px,env(safe-area-inset-bottom))}.top{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:22px}.eyebrow{font-size:11px;color:var(--amber2);letter-spacing:.16em;font-weight:750;text-transform:uppercase}.brand{font-size:18px;font-weight:850;letter-spacing:.01em;margin-top:5px}.tag{font-size:11px;font-weight:700;background:rgba(250,166,50,.12);border:1px solid var(--edge);border-radius:100px;color:var(--amber2);padding:9px 11px;white-space:nowrap}.stepnav{display:grid;grid-template-columns:repeat(5,1fr);gap:7px;margin:0 0 22px}.stepbtn{border:1px solid var(--edge);border-radius:14px;background:rgba(255,235,201,.045);padding:11px 2px;color:var(--muted);font-size:12px;line-height:1.2;transition:.2s}.stepbtn .n{display:block;font-size:17px;font-weight:850;margin-bottom:5px;color:var(--sub)}.stepbtn.active{background:linear-gradient(155deg,#ffba54,#f29a26);border-color:#ffba54;color:#392009;box-shadow:0 5px 28px rgba(240,133,26,.2)}.stepbtn.active .n{color:#392009}.stepbtn.done .n{color:var(--safe)}.hero{position:relative;overflow:hidden;border:1px solid var(--edge);border-radius:27px;background:linear-gradient(155deg,rgba(61,39,23,.96),rgba(30,22,18,.96));padding:23px 18px 21px;box-shadow:0 25px 60px rgba(0,0,0,.18);text-align:center}.tinyline{display:flex;justify-content:center;align-items:center;gap:9px;color:var(--amber2);font-size:11px;letter-spacing:.12em;font-weight:750}.tinyline:before,.tinyline:after{content:"";height:1px;width:27px;background:rgba(245,175,70,.32)}h1{font-size:clamp(27px,8vw,41px);line-height:1.25;margin:14px 0 13px;letter-spacing:-.03em}.heat{display:inline-flex;align-items:center;gap:9px;border:1px solid rgba(248,162,49,.4);border-radius:30px;padding:8px 17px;background:rgba(255,158,30,.09);font-size:16px;font-weight:750}.heat strong{font-size:26px;color:var(--amber);font-variant-numeric:tabular-nums}.ring{--percent:0;position:relative;width:min(79vw,310px);height:min(79vw,310px);margin:12px auto 12px;display:grid;place-items:center}.ring svg{position:absolute;inset:0;width:100%;height:100%;transform:rotate(-90deg)}.ring circle{fill:none;stroke-width:6}.track{stroke:rgba(255,209,153,.13)}.progress{stroke:#ffad42;stroke-linecap:round;transition:stroke-dashoffset .25s linear;filter:drop-shadow(0 0 5px rgba(255,170,52,.5))}.clock{font-size:clamp(64px,17vw,91px);line-height:1.1;font-weight:900;letter-spacing:-.065em;font-variant-numeric:tabular-nums;text-indent:-.06em}.caption{font-size:13px;color:var(--sub);margin-top:8px}.instructions{display:grid;gap:11px;text-align:left;padding:15px 4px 4px}.instruction{display:flex;align-items:flex-start;gap:10px;font-size:15px;line-height:1.5}.dot{width:8px;height:8px;background:var(--amber);border-radius:50%;flex:none;margin-top:8px;box-shadow:0 0 0 4px rgba(246,161,49,.10)}.halfhint{display:none;margin-top:14px;padding:11px;border:1px solid rgba(255,203,108,.3);border-radius:12px;background:rgba(255,192,80,.1);color:var(--amber2);font-weight:700;font-size:13px}.halfhint.on{display:block}.buttons{display:grid;grid-template-columns:1fr auto;gap:10px;margin-top:15px}.primary{border:0;border-radius:17px;background:linear-gradient(110deg,#ffce72,#f4a035);color:#37210e;font-weight:900;font-size:19px;padding:18px 22px;box-shadow:0 8px 28px rgba(237,148,32,.2)}.secondary{border:1px solid var(--edge);border-radius:17px;background:#30231a;color:var(--ink);font-weight:800;padding:16px 17px;font-size:15px}.actions{display:flex;justify-content:center;gap:9px;margin-top:12px;flex-wrap:wrap}.minor{border:1px solid var(--edge);background:rgba(255,241,214,.04);color:var(--sub);font-size:13px;border-radius:14px;padding:11px 13px;font-weight:650}.options{margin-top:20px;border:1px solid var(--edge);border-radius:21px;padding:17px;background:rgba(255,240,207,.03)}.sectionhead{font-size:14px;font-weight:850;color:var(--ink);margin-bottom:12px}.toggleline{display:flex;justify-content:space-between;gap:14px;align-items:center;padding:12px 0;border-top:1px solid rgba(255,255,255,.06)}.toggleline:first-of-type{border:0;padding-top:0}.toggleline:last-of-type{padding-bottom:0}.togglelabel{font-size:14px;font-weight:700}.togglehint{color:var(--muted);font-size:11px;margin-top:4px;line-height:1.4}.switch{position:relative;display:block;width:46px;height:28px;flex:none}.switch input{opacity:0;position:absolute;width:100%;height:100%;margin:0;z-index:1;cursor:pointer}.slider{position:absolute;inset:0;border-radius:20px;background:#493a2c;transition:.2s}.slider:before{content:"";position:absolute;left:3px;top:3px;width:22px;height:22px;border-radius:50%;background:#eee2d3;transition:.2s}.switch input:checked+.slider{background:var(--amber)}.switch input:checked+.slider:before{transform:translateX(18px);background:#2d1d0e}.foot{padding:18px 4px 0;color:var(--muted);font-size:12px;line-height:1.65}.foot b{color:var(--sub)}.toast{position:fixed;left:50%;bottom:25px;transform:translate(-50%,120px);max-width:calc(100% - 32px);min-width:230px;text-align:center;border-radius:14px;padding:12px 18px;background:#fff1d8;color:#34200d;font-weight:750;font-size:14px;z-index:200;box-shadow:0 10px 60px #0009;transition:.3s;pointer-events:none}.toast.show{transform:translate(-50%,0)}.done-screen .clock{color:var(--safe)}.done-screen .progress{stroke:var(--safe)}.statusline{font-size:14px;font-weight:750;min-height:21px;margin-top:1px;color:var(--amber2)}.warn{display:block;font-size:12px;color:var(--muted);margin-top:11px}footer a{color:var(--amber2)}@media (min-width:680px){.wrap{padding:38px 23px}.hero{padding:28px 30px 24px}.ring{margin:10px auto 6px}}@media(prefers-reduced-motion:reduce){*,*:before,*:after{transition:none!important;animation:none!important}}
</style>
</head>
<body>
<main class="wrap">
<header class="top"><div><div class="eyebrow">KITCHEN TIMER</div><div class="brand">蜜味雞中翼</div></div><div class="tag">SIEMENS · 電磁爐</div></header>
<nav class="stepnav" id="stepnav" aria-label="煮食步驟"></nav>
<section class="hero" id="hero" aria-live="off">
<div class="tinyline" id="stepLabel">STEP 1 / 5</div>
<h1 id="title">預熱平底鑊</h1>
<div class="heat">♨ 火力 <strong id="heat">7</strong></div>
<div class="ring" role="timer" aria-label="剩餘時間"><svg viewBox="0 0 300 300" aria-hidden="true"><circle class="track" cx="150" cy="150" r="139"></circle><circle id="prog" class="progress" cx="150" cy="150" r="139"></circle></svg><div><div class="clock" id="clock">01:00</div><div class="caption" id="caption">準備好就按開始</div></div></div>
<div class="statusline" id="statusline">準備開始</div>
<div class="instructions" id="instructions"></div>
<div class="halfhint" id="halfHint">提示：依家反轉一次雞翼，然後繼續焗</div>
</section>
<div class="buttons"><button id="mainButton" class="primary" type="button">▶ 開始計時</button><button id="nextButton" class="secondary" type="button">下一步 →</button></div>
<div class="actions"><button class="minor" id="minus" type="button">−30 秒</button><button class="minor" id="plus" type="button">+30 秒</button><button class="minor" id="prev" type="button">← 上一步</button><button class="minor" id="reset" type="button">↻ 重設本步</button></div>
<section class="options" aria-label="計時設定"><div class="sectionhead">計時設定</div>
<div class="toggleline"><div><div class="togglelabel">完成後自動轉下一步</div><div class="togglehint">預設關閉，等你確認已反雞翼／加水先開始</div></div><label class="switch"><input type="checkbox" id="auto" aria-label="自動轉下一步"><span class="slider"></span></label></div>
<div class="toggleline"><div><div class="togglelabel">提示聲及震動</div><div class="togglehint">每步完成提醒；焗雞翼過半會提醒反面</div></div><label class="switch"><input type="checkbox" id="sound" checked aria-label="提示聲及震動"><span class="slider"></span></label></div>
<div class="toggleline"><div><div class="togglelabel">保持螢幕亮著</div><div class="togglehint">視乎瀏覽器支援；iPhone 建議保持頁面開啟</div></div><label class="switch"><input type="checkbox" id="wake" aria-label="保持螢幕亮著"><span class="slider"></span></label></div>
</section>
<p class="foot"><b>煮食提示：</b>蜜味醃汁含糖，見到變黑即減火。以上火力為建議起點，實際按鑊具調整。雞翼最厚肉位中心達 <b>75°C</b> 才算熟透。<br><br><b>注意：</b>手機鎖屏或將網頁切到背景時，iOS 未必會播放提示聲；建議煮食時保持網站喺畫面。</p>
</main>
<div class="toast" id="toast" role="status" aria-live="polite"></div>
<script>
(()=>{'use strict';
const STEPS=[
 {name:'預熱',title:'預熱平底鑊',heat:'7',sec:60,points:['落 1 茶匙油','先以火力 7 預熱約 45–60 秒'],tip:'鑊面微熱就可以落雞翼'},
 {name:'第一面',title:'雞皮向下煎',heat:'6.5',sec:240,points:['雞皮向下平放，先唔好郁','煎至金黃；蜜汁變黑即降低火力'],tip:'約 4 分鐘後反面'},
 {name:'第二面',title:'反面再煎',heat:'6',sec:240,points:['逐隻反轉雞翼','另一面煎香至金黃'],tip:'接住加水蓋鑊焗熟'},
 {name:'焗熟',title:'加水蓋鑊焗熟',heat:'5',sec:420,points:['加入 2 湯匙水，蓋上鑊蓋','保持微滾；約一半時間反一次'],tip:'焗到雞翼熟透先收汁'},
 {name:'收汁',title:'開蓋收汁上色',heat:'6',sec:120,points:['開蓋讓蜜汁收濃，間中反面','見到焦糖金黃色就可以熄火','最厚肉位置中心須達 75°C'],tip:'煮好就上碟；未熟要繼續加熱'}
];
const $=id=>document.getElementById(id);const ring=$('prog');const circ=2*Math.PI*139;ring.style.strokeDasharray=String(circ);let step=0,remaining=60e3,duration=60e3,deadline=0,status='idle',halfAlert=false,auto=false,sound=true,wake=false,lock=null,ctx=null,toastHandle=null,lastTickSec=-1;
function save(){try{localStorage.setItem('wingsTimerV2',JSON.stringify({step,remaining,duration,deadline,status,halfAlert,auto,sound,wake:false}))}catch{}}
function restore(){try{const s=JSON.parse(localStorage.getItem('wingsTimerV2')||'null');if(!s||!Number.isInteger(s.step)||s.step<0||s.step>=STEPS.length)return;step=s.step;duration=Number(s.duration)||STEPS[step].sec*1000;remaining=Number(s.remaining)||0;deadline=Number(s.deadline)||0;status=['idle','running','paused','ready','done'].includes(s.status)?s.status:'idle';halfAlert=!!s.halfAlert;auto=!!s.auto;sound=s.sound!==false;if(status==='running')remaining=Math.max(0,deadline-Date.now());if(status==='running'&&remaining===0){status=step===STEPS.length-1?'done':'ready';}if(status==='done'&&step!==STEPS.length-1)status='ready';}catch{}}
function timetext(ms){let ss=Math.max(0,Math.ceil(ms/1000));return String(Math.floor(ss/60)).padStart(2,'0')+':'+String(ss%60).padStart(2,'0')}
function toast(message){const e=$('toast');e.textContent=message;e.classList.add('show');clearTimeout(toastHandle);toastHandle=setTimeout(()=>e.classList.remove('show'),3500)}
function tone(freq=660,start=0,len=.16){if(!sound)return;try{ctx=ctx||new(window.AudioContext||window.webkitAudioContext)();if(ctx.state==='suspended')ctx.resume();let o=ctx.createOscillator(),g=ctx.createGain(),t=ctx.currentTime+start;o.type='sine';o.frequency.value=freq;g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(.17,t+.015);g.gain.exponentialRampToValueAtTime(.0001,t+len);o.connect(g).connect(ctx.destination);o.start(t);o.stop(t+len+.02)}catch{}}
function alertUser(completed=true){if(!sound)return;[0,.23,.46].forEach((t,i)=>tone(completed?750+i*110:610,t,.15));try{navigator.vibrate?.(completed?[180,80,180]:[140])}catch{}}
function initSound(){if(!sound)return;try{ctx=ctx||new(window.AudioContext||window.webkitAudioContext)();if(ctx.state==='suspended')ctx.resume()}catch{}}
async function tryWake(){if(!wake||!('wakeLock' in navigator)||document.visibilityState!=='visible')return;try{lock=await navigator.wakeLock.request('screen');lock.addEventListener('release',()=>{lock=null})}catch{toast('瀏覽器暫時唔支援保持亮屏')}}
async function releaseWake(){if(lock){try{await lock.release()}catch{}lock=null}}
function paintNav(){const nav=$('stepnav');nav.innerHTML='';STEPS.forEach((s,i)=>{const b=document.createElement('button');b.className='stepbtn'+(i===step?' active':i<step?' done':'');b.type='button';b.innerHTML='<span class="n">'+(i<step?'✓':i+1)+'</span>'+s.name;b.setAttribute('aria-label','切換到第'+(i+1)+'步：'+s.name);if(i===step)b.setAttribute('aria-current','step');b.onclick=()=>jump(i);nav.appendChild(b)});}
function render(){const s=STEPS[step];$('stepLabel').textContent='STEP '+(step+1)+' / '+STEPS.length;$('title').textContent=s.title;$('heat').textContent=s.heat;$('instructions').innerHTML=s.points.map(p=>'<div class="instruction"><span class="dot"></span><span>'+p+'</span></div>').join('');$('halfHint').classList.toggle('on',step===3&&halfAlert&&status!=='done');$('hero').classList.toggle('done-screen',status==='done');paintNav();$('auto').checked=auto;$('sound').checked=sound;$('wake').checked=wake;renderClock(true)}
function renderClock(force=false){const sec=Math.ceil(remaining/1000);if(!force&&sec===lastTickSec)return;lastTickSec=sec;$('clock').textContent=timetext(remaining);ring.style.strokeDashoffset=String(circ*(1-Math.min(1,Math.max(0,(duration-remaining)/duration))));$('caption').textContent=status==='running'?'倒數進行中':status==='paused'?'已暫停':status==='ready'?'本步完成，請確認動作':'done'===status?'煮食完成':'準備好就按開始';$('statusline').textContent=status==='running'?'進行中 · '+STEPS[step].tip:status==='paused'?'倒數已暫停':status==='ready'?'時間到！完成操作後轉下一步':status==='done'?'完成！檢查雞翼中心達 75°C':'第 '+(step+1)+' 步已準備好';$('mainButton').textContent=status==='running'?'Ⅱ 暫停':status==='paused'?'▶ 繼續倒數':status==='ready'?'✓ 完成，下一步':status==='done'?'↻ 重新煮一次':'▶ 開始計時';$('nextButton').textContent=step===4?'完成 ✓':'下一步 →';$('nextButton').disabled=status==='done';$('prev').disabled=step===0;}
function start(){initSound();if(status==='ready'){next();return}if(status==='done'){jump(0);start();return}if(status==='running'){remaining=Math.max(0,deadline-Date.now());status='paused';save();renderClock(true);return}if(remaining<=0)remaining=duration;deadline=Date.now()+remaining;status='running';save();renderClock(true);if(wake)tryWake()}
function complete(){remaining=0;status=step===STEPS.length-1?'done':'ready';alertUser();save();render();if(status==='done')toast('煮食完成！請確保雞翼中心溫度達 75°C');else{toast('第 '+(step+1)+' 步完成：'+STEPS[step+1].title);if(auto)next(true)}}
function tick(){if(status!=='running')return;remaining=Math.max(0,deadline-Date.now());if(step===3&&!halfAlert&&remaining<=duration/2&&remaining>0){halfAlert=true;alertUser(false);toast('焗熟過半，依家反一次雞翼');$('halfHint').classList.add('on');save()}if(remaining<=0){complete();return}renderClock()}
function jump(i){if(i<0||i>=STEPS.length)return;step=i;duration=STEPS[step].sec*1000;remaining=duration;deadline=0;status='idle';halfAlert=false;lastTickSec=-1;save();render()}
function next(fromAuto=false){if(step===STEPS.length-1){status='done';remaining=0;save();render();toast('已到最後一步，檢查熟度後即可上碟');return}jump(step+1);if(fromAuto)start()}
function adjust(delta){if(status==='done'||status==='ready'){status='paused'}remaining=Math.max(1000,remaining+delta*1000);duration=Math.max(remaining,duration+delta*1000);if(status==='running')deadline=Date.now()+remaining;save();renderClock(true);toast((delta>0?'+':'')+delta+' 秒')}
$('mainButton').onclick=start;$('nextButton').onclick=()=>next(false);$('prev').onclick=()=>jump(Math.max(0,step-1));$('reset').onclick=()=>{jump(step);toast('已重設本步')};$('plus').onclick=()=>adjust(30);$('minus').onclick=()=>adjust(-30);$('auto').onchange=e=>{auto=e.target.checked;save();toast(auto?'自動轉步驟已開啟':'每步完成需要手動確認')};$('sound').onchange=e=>{sound=e.target.checked;if(sound)initSound();save()};$('wake').onchange=e=>{wake=e.target.checked;if(wake)tryWake();else releaseWake();save()};document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible'){tick();if(wake)tryWake()}});document.addEventListener('keydown',e=>{if(e.code==='Space'&&!['INPUT','BUTTON'].includes(document.activeElement.tagName)){e.preventDefault();start()}});restore();render();setInterval(tick,200);
})();
</script>
</body>
</html>
